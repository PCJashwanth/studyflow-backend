name: CI

on:
  push:
    branches: [dev, main] # dev is this repo's default branch
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - run: npm run lint
      - name: Run tests
        run: npm test
        # The suite never touches a database, but config/env.js validates these
        # at import time, so CI needs placeholder values.
        env:
          JWT_SECRET: test-secret-at-least-16-chars
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
